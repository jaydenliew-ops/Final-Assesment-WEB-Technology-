<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Housing Sales Management</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0;
    }
    .page-header h2 { color: #1a1a2e; font-size: 24px; margin: 0; }
    .bookings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
    .booking-card {
      background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .booking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #cbd5e1; }
    .booking-body { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #334155; margin-bottom: 15px; }
    .info-row { display: flex; justify-content: space-between; align-items: center; }
    .particulars-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 13px; }
    .particulars-title { font-weight: 700; color: #0369a1; margin-bottom: 4px; }
    .badge-tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .badge-confirmed { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-pending { background-color: #fef9c3; color: #a16207; border: 1px solid #fef08a; }
    .badge-cancelled { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .card-actions { display: flex; gap: 6px; padding-top: 12px; border-top: 1px solid #f1f5f9; flex-wrap: wrap; }
    .btn-action {
      flex: 1; min-width: 30%; padding: 8px 4px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; border: none; text-align: center;
    }
    .btn-particulars { background-color: #0284c7; color: white; }
    .btn-edit { background-color: #475569; color: white; }
    .btn-pay { background-color: #059669; color: white; }
    .btn-cancel { background-color: #ef4444; color: white; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #ffffff; padding: 24px; border-radius: 12px; width: 90%; max-width: 440px; box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .modal-content h3 { margin-top: 0; color: #1a1a2e; font-size: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13px;
    }
    .detail-view-row { margin-bottom: 12px; font-size: 14px; color: #334155; }
    .detail-view-row strong { color: #0f172a; display: inline-block; width: 130px; }
  </style>
  <script src="client.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <h2>Housing Sales Management</h2>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="units.html">Properties</a></li>
      <li><a href="buyers.html">My Bookings</a></li>
      <li><a href="login.html">Login / Register</a></li>
    </ul>
  </nav>

  <div class="container main">
    <div class="page-header">
      <h2>📋 My Booking Records</h2>
      <button class="btn btn-primary" onclick="loadUserBookings()">🔄 Refresh Records</button>
    </div>
    <p class="notice" id="payment-notice">Payments are unavailable. No real funds are collected by this application.</p><p id="page-message" role="status"></p><div id="booking-list">
      <p class="empty">Loading your bookings...</p>
    </div>
  </div>

  <!-- View Particulars Modal -->
  <div id="viewParticularsModal" class="modal-overlay">
    <div class="modal-content">
      <h3>👤 Current Customer Particulars</h3>
      <div id="viewParticularsBody" style="margin-bottom: 20px;"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button type="button" class="btn btn-primary" onclick="closeModal('viewParticularsModal')" style="background:#0284c7; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <!-- Edit Particulars Modal -->
  <div id="buyerModal" class="modal-overlay">
    <div class="modal-content">
      <h3>✏️ Edit Buyer Particulars</h3>
      <form id="buyerDetailsForm">
        <input type="hidden" id="editReservationId">
        <div class="form-group">
          <label>Full Name (as per IC/Passport):</label>
          <input type="text" id="buyerFullName" required>
        </div>
        <div class="form-group">
          <label>IC / Passport Number:</label>
          <input type="text" id="buyerIcNumber" required>
        </div>
        <div class="form-group">
          <label>Contact Phone Number:</label>
          <input type="text" id="buyerPhone" required>
        </div>
        <div class="form-group">
          <label>Remarks / Loan Info:</label>
          <textarea id="buyerRemarks" rows="2"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button type="button" class="btn btn-disabled" onclick="closeModal('buyerModal')" style="background:#cbd5e1; color:#334155; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="background:#0284c7; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  
<script src="buyers.js" defer></script>
</body>
</html>
